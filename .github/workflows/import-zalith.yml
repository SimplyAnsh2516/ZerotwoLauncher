name: Import Zalith source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZeroTwo Launcher
        uses: actions/checkout@v4

      - name: Download Zalith source
        run: |
          git clone --depth 1 --branch 1.4.1.4 \
            https://github.com/ZalithLauncher/ZalithLauncher.git upstream

      - name: Import source files
        run: |
          rsync -a --exclude='.git' upstream/ ./
          rm -rf upstream

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || \
            git commit -m "Import Zalith Launcher 1.4.1.4 source"
          git push