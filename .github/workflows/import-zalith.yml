
name: Import Zalith source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Import Zalith Launcher source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZeroTwo Launcher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Zalith source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/ZalithLauncher/ZalithLauncher.git
          git -C upstream fetch --depth 1 origin 6550846bb8e9496d8c83ed8b3b8d924a1e7b3e1d
          git -C upstream checkout --detach FETCH_HEAD

      - name: Import source files
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            upstream/ ./
          rm -rf upstream

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import Zalith Launcher 1.4.1.4 source"
            git push origin HEAD:main
          fi
